# Render Blueprint: the API and the web app as two web services, with Cloudflare in front of the
# web app (lumiback.abhinesh.codes). Step-by-step setup: README.md -> "Deploying".
#
# Both run as ONE instance each: live updates fan out in-process (app/realtime.py), and the web
# app de-duplicates token refreshes in memory (src/proxy.ts). Scaling out needs a shared hub first.
# Region: put both services next to the Supabase database; every API request talks to it.

services:
  - type: web
    name: lumiback-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildFilter:
      paths: ["backend/**"]
    # Render provides uv (because of uv.lock) and its own Python (PYTHON_VERSION below); it does
    # not allow uv-managed Pythons. Installs exactly the locked runtime dependencies into .venv.
    buildCommand: uv sync --frozen --no-dev
    # Migrations run before the server starts; safe with a single instance.
    startCommand: >-
      .venv/bin/alembic upgrade head &&
      exec .venv/bin/uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION # fully qualified, as Render requires (pyproject: >=3.13)
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL # Supabase session pooler, postgresql+psycopg:// scheme
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CODE_PEPPER
        generateValue: true
      - key: INTERNAL_API_SECRET # shared with the web app below
        generateValue: true
      - key: PROXY_HOPS # Render's load balancer appends the caller's IP to X-Forwarded-For
        value: "1"
      - key: CORS_ORIGINS
        value: https://lumiback.abhinesh.codes
      - key: ALLOWED_EMAIL_DOMAINS
        value: geu.ac.in
      - key: EMAIL_BACKEND # HTTPS API: Render's free plan blocks outbound SMTP ports
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Lumiback <no-reply@lumiback.abhinesh.codes>

  - type: web
    name: lumiback-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildFilter:
      paths: ["apps/web/**"]
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BACKEND_URL # the API's https://lumiback-api-XXXX.onrender.com address
        sync: false
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: lumiback-api
          envVarKey: INTERNAL_API_SECRET
      - key: CLIENT_IP_HEADER # set by Cloudflare on every request
        value: cf-connecting-ip
      - key: EDGE_SECRET # also set in the Cloudflare rule that adds X-Edge-Auth
        sync: false
