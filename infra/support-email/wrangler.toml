# Email Worker behind support@lumiback.abhinesh.codes (see README "Support email").
# FORWARD_TO (a verified Email Routing destination) is set on the Worker in the dashboard,
# not here, so no personal address lives in the repository.
name = "lumiback-support-email"
main = "worker.js"
compatibility_date = "2026-10-01"

# Keeps the API awake during outing hours (see keepAwake in worker.js). Set KEEP_AWAKE_URL
# (the API's /health) on the Worker; KEEP_AWAKE_FROM/UNTIL (HH:MM IST) narrow the window.
[triggers]
crons = ["*/10 * * * *"]

# Keeps Workers Logs on, so each email's auto-reply decision is visible in the dashboard.
[observability]
enabled = true
