# Email Worker behind support@lumiback.abhinesh.codes (see README "Hosting").
# This file is the source of truth for the Worker's plain variables: `wrangler deploy` replaces
# whatever the dashboard holds with [vars] below. Anything private is a secret instead, which a
# deploy never touches:
#   npx wrangler secret put FORWARD_TO       (a verified Email Routing destination)
#   npx wrangler secret put RESEND_API_KEY   (a sending-only Resend key; without it, auto-replies
#                                             fall back to Cloudflare and health alerts are off)
# Health alerts: when a keep-awake ping finds the API or website down, or the API's sweep stale,
# the cron run at minute 0 or 30 emails FORWARD_TO (at most 2 emails an hour per incident).
name = "lumiback-support-email"
main = "worker.js"
compatibility_date = "2026-10-09"
preview_urls = false

# Keeps the Render services awake in their windows (see AWAKE_TARGETS in worker.js). Use the
# onrender.com addresses: a ping answered from Cloudflare's cache never reaches Render. The
# API's /health queries the database, so its pings also keep Supabase active. Optional HH:MM
# IST windows: KEEP_AWAKE_FROM/UNTIL (default 09:30-22:00), KEEP_AWAKE_WEB_FROM/UNTIL (17:00-22:00).
[vars]
KEEP_AWAKE_URL = "https://lumiback-api-zjcl.onrender.com/health"
KEEP_AWAKE_WEB_URL = "https://lumiback-web.onrender.com/app/android.json"

[triggers]
crons = ["*/10 * * * *"]

# Auto-reply limits (Workers Rate Limiting; needs Wrangler 4.36.0 or later). Every auto-reply is a
# Resend send, and the health alerts share that key and quota, so mail floods must not spend it.
# Over a limit, or without these bindings, the sender gets no auto-reply; the email is still
# forwarded. Counts are per Cloudflare location and per 60-second window (period must be 10 or
# 60), so this caps the rate of replies, not a daily total. namespace_id is any positive integer
# (as a string) that no other rate limiter in the account uses.
# Docs: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "AUTO_REPLY_SENDER_LIMIT"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 1
  period = 60

[[ratelimits]]
name = "AUTO_REPLY_GLOBAL_LIMIT"
namespace_id = "4102"

  [ratelimits.simple]
  limit = 5
  period = 60

# Keeps Workers Logs on, so each email's auto-reply decision is visible in the dashboard.
[observability]
enabled = true
