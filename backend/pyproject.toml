[project]
name = "outing-backend"
version = "0.1.0"
description = "Outing API: outings + consent-based location sharing"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "sqlalchemy[asyncio]>=2.0.36",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Test SQL is assembled from constants in the test file itself.
"tests/**" = ["S105", "S106", "S608"]  # fake credentials and constant SQL in tests
