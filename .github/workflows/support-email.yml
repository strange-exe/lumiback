name: support-email

on:
  push:
    branches: [main]
    paths: ["infra/support-email/**", ".github/workflows/support-email.yml"]
  pull_request:
    paths: ["infra/support-email/**", ".github/workflows/support-email.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/support-email

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check worker.js
      - run: node --test worker.test.mjs
