name: backup

# Nightly encrypted pg_dump of the production database to the private "backups" bucket in
# Supabase Storage, keeping 14 days. The logic and the restore steps are in infra/backup/backup.sh.
#
# Repository secrets: DATABASE_URL_BACKUP (Supabase SESSION pooler URL; GitHub runners have no
# IPv6, so not the direct connection), BACKUP_PASSPHRASE, SUPABASE_URL, SUPABASE_SERVICE_KEY.
# Repository variable (optional): PG_MAJOR, the server's major version (default 17).

on:
  schedule:
    - cron: "47 20 * * *" # 20:47 UTC = 02:17 IST, off the hour (busy minutes start late)
  workflow_dispatch:

permissions: {}

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only contents: read, which checkout needs to fetch the script; nothing else.
    permissions:
      contents: read
    env:
      PG_MAJOR: ${{ vars.PG_MAJOR || '17' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # PostgreSQL apt repository, per https://www.postgresql.org/download/linux/ubuntu/
      # (manual configuration), with the key's fingerprint checked before it is trusted.
      - name: Install PostgreSQL client ${{ env.PG_MAJOR }}
        run: |
          set -euo pipefail
          [[ $PG_MAJOR =~ ^[0-9]+$ ]] || { echo "::error::PG_MAJOR must be a number"; exit 1; }
          key=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o "$key" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fpr="$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ $fpr != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]]; then
            echo "::error::unexpected PostgreSQL apt key fingerprint"
            exit 1
          fi
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: %s\n' \
            "$VERSION_CODENAME" "$key" | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "postgresql-client-$PG_MAJOR"
          # Use exactly this version, not whatever the runner image's pg_wrapper picks.
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Back up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKUP_BUCKET: backups
          KEEP_DAYS: "14"
        run: bash infra/backup/backup.sh
