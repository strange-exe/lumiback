name: web-wake

on:
  push:
    branches: [main]
    paths: ["infra/web-wake/**", ".github/workflows/web-wake.yml"]
  pull_request:
    paths: ["infra/web-wake/**", ".github/workflows/web-wake.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/web-wake

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --check worker.js
      - run: node --test worker.test.mjs
