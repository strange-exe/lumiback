name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "backend/**"
      # Read by apps/web/src/lib/changelog.test.ts.
      - "apps/mobile/src/updates/changelog.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "backend/**"
      - "apps/mobile/src/updates/changelog.json"
      - ".github/workflows/web.yml"
  schedule:
    - cron: "30 3 * * 1" # Mondays 09:00 IST: surface new advisories without a push

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: http://127.0.0.1:8100 # required at build time; never contacted here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    if: github.event_name != 'schedule'
    # Pinned to an image that already ships Chrome's system libraries, so the browser install
    # below needs no apt (on 2026-11-11 apt could not resolve the Ubuntu mirrors on 26.04 or 24.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outing_test
          POSTGRES_PASSWORD: outing_test
          POSTGRES_DB: outing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U outing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://outing_test:outing_test@localhost:5432/outing_test
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate throwaway API secrets for this run
        # Masked before they reach $GITHUB_ENV, or every later step's env block prints them.
        run: |
          for name in JWT_SECRET CODE_PEPPER; do
            value="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Prepare the API and test database
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic -x db=test upgrade head
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
